version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: simtrade-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: simtrade
      POSTGRES_PASSWORD: simtrade
      POSTGRES_DB: simtrade
    ports:
      - "5432:5432"
    volumes:
      - simtrade_pgdata:/var/lib/postgresql/data

volumes:
  simtrade_pgdata:
