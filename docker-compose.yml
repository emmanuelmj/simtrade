services:
  db:
    image: postgres:16-alpine
    container_name: synthex_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: synthex
      POSTGRES_PASSWORD: synthex_dev
      POSTGRES_DB: synthex
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
